# Netlify setup (build from the repository root)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The React app calls /api/career-guidance - route it to the Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app: every other path loads index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
